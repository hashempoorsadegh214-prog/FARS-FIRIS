<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پایش و پهنه‌بندی خطر آتش‌سوزی (FWI) استان فارس</title>

    <!-- کتابخانه‌های Leaflet و Turf.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Tahoma, 'Vazir', sans-serif;
            background-color: #121212;
            color: #fff;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .info-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(6px);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #444;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 1.6;
        }
        .info-panel h3 {
            margin: 0 0 8px 0;
            color: #ff9800;
            font-size: 15px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .legend {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-color { width: 18px; height: 14px; margin-left: 8px; border-radius: 3px; }
        .status-loading { color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h3>سامانه پایش خطر حریق استان فارس (FWI)</h3>
        <div id="status" class="status-loading">⏳ در حال آماده‌سازی شبکه و داده‌ها...</div>
        <div id="cell-info" style="margin-top: 8px; display: none;">
            <b>مشخصات سلول انتخابی:</b><br>
            شاخص خطر: <span id="fwi-val">-</span><br>
            دما: <span id="temp-val">-</span> °C | رطوبت: <span id="rh-val">-</span>%<br>
            سرعت باد: <span id="wind-val">-</span> km/h | بارندگی: <span id="rain-val">-</span> mm
        </div>
    </div>

    <div class="legend">
        <b>راهنمای پهنه‌بندی خطر:</b>
        <div class="legend-item"><span class="legend-color" style="background: #2e7d32;"></span> کم (FWI &lt; 15)</div>
        <div class="legend-item"><span class="legend-color" style="background: #fbc02d;"></span> متوسط (15 - 25)</div>
        <div class="legend-item"><span class="legend-color" style="background: #f57c00;"></span> زیاد (25 - 35)</div>
        <div class="legend-item"><span class="legend-color" style="background: #d32f2f;"></span> بسیار زیاد (35 - 45)</div>
        <div class="legend-item"><span class="legend-color" style="background: #7b1fa2;"></span> بحرانی (&gt; 45)</div>
    </div>

    <div id="map"></div>

    <script>
        // ۱. مقداردهی اولیه نقشه روی استان فارس
        const map = L.map('map').setView([29.2, 53.2], 7);

        // بیس‌مپ تیره (CartoDB DarkMatter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CartoDB & OpenStreetMap',
            maxZoom: 18
        }).addTo(map);

        // ۲. تابع محاسبه رنگ بر اساس مقدار FWI
        function getFWIColor(fwi) {
            return fwi > 45 ? '#7b1fa2' :
                   fwi > 35 ? '#d32f2f' :
                   fwi > 25 ? '#f57c00' :
                   fwi > 15 ? '#fbc02d' :
                              '#2e7d32';
        }

        // ۳. اندازه سلول شبکه — استاندارد اولیه خودِ داده (۰.۱۸ درجه)
        const step = 0.18;

        async function initApp() {
            const statusEl = document.getElementById('status');
            try {
                // بارگذاری مرز استان (fars.geojson و در نبودش fars_districts.geojson)
                let boundaryData;
                try {
                    const res = await fetch('fars.geojson');
                    if (!res.ok) throw new Error();
                    boundaryData = await res.json();
                } catch {
                    const fallbackRes = await fetch('fars_districts.geojson');
                    boundaryData = await fallbackRes.json();
                }

                // رسم خطوط محدوده استان
                L.geoJSON(boundaryData, {
                    style: { color: '#00e5ff', weight: 1.5, fillOpacity: 0.05 }
                }).addTo(map);

                // لایه مناطق حفاظت‌شده (خط‌چین سبز)
                fetch('protected_areas.geojson').then(r => r.json()).then(data => {
                    L.geoJSON(data, {
                        style: { color: '#00e676', weight: 1.5, dashArray: '4, 4', fillOpacity: 0.1 }
                    }).addTo(map);
                }).catch(() => {});

                // لایه مناطق شکارممنوع (خط‌چین زرد)
                fetch('hunting_banned.geojson').then(r => r.json()).then(data => {
                    L.geoJSON(data, {
                        style: { color: '#ffea00', weight: 1.5, dashArray: '2, 4', fillOpacity: 0.08 }
                    }).addTo(map);
                }).catch(() => {});

                statusEl.innerText = '⚙️ در حال محاسبه شبکه مختصات...';

                const boundaryFeatures = boundaryData.features ? boundaryData : turf.featureCollection([boundaryData]);

                // بازه گسترده مختصات — پوشش کامل تمام مرزهای استان
                const minLat = 26.8;
                const maxLat = 31.9;
                const minLon = 50.3;
                const maxLon = 55.8;

                const gridPolygons = [];

                for (let lat = minLat; lat <= maxLat; lat += step) {
                    for (let lon = minLon; lon <= maxLon; lon += step) {
                        const cellBBox = [lon, lat, lon + step, lat + step];
                        const cellPoly = turf.bboxPolygon(cellBBox);

                        // فیلتر تقاطع سلول با مرز استان
                        let intersects = false;
                        for (let f of boundaryFeatures.features) {
                            if (turf.booleanIntersects(cellPoly, f)) {
                                intersects = true;
                                break;
                            }
                        }

                        if (intersects) {
                            gridPolygons.push({
                                poly: cellPoly,
                                centerLat: lat + step / 2,
                                centerLon: lon + step / 2
                            });
                        }
                    }
                }

                statusEl.innerText = `📡 دریافت داده‌ها برای ${gridPolygons.length} سلول...`;

                const gridLayerGroup = L.layerGroup().addTo(map);

                // دریافت داده‌های هواشناسی و رسم سلول‌ها
                for (let item of gridPolygons) {
                    const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${item.centerLat}&longitude=${item.centerLon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation`;

                    fetch(weatherUrl)
                        .then(res => res.json())
                        .then(wData => {
                            const cur = wData.current || {};
                            const temp = cur.temperature_2m || 0;
                            const rh = cur.relative_humidity_2m || 0;
                            const wind = cur.wind_speed_10m || 0;
                            const rain = cur.precipitation || 0;

                            const fwi = Math.max(0, (temp * 0.4) + (wind * 0.3) - (rh * 0.15) - (rain * 2));
                            const color = getFWIColor(fwi);

                            const leafletPolygon = L.geoJSON(item.poly, {
                                style: {
                                    fillColor: color,
                                    fillOpacity: 0.65,
                                    weight: 0.8,
                                    color: '#222'
                                }
                            });

                            leafletPolygon.on('click', () => {
                                document.getElementById('cell-info').style.display = 'block';
                                document.getElementById('fwi-val').innerText = fwi.toFixed(1);
                                document.getElementById('temp-val').innerText = temp;
                                document.getElementById('rh-val').innerText = rh;
                                document.getElementById('wind-val').innerText = wind;
                                document.getElementById('rain-val').innerText = rain;
                            });

                            gridLayerGroup.addLayer(leafletPolygon);
                        })
                        .catch(() => {});
                }

                statusEl.innerText = '✅ سامانه به‌روز و فعال است.';

            } catch (err) {
                console.error(err);
                statusEl.innerText = '⚠️ خطا در بارگذاری لایه‌ها یا نقشه.';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
